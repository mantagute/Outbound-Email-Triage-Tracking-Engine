services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    command: pytest -v

  lint:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    command: ruff check src tests
